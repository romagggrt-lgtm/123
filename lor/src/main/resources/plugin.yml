name: Z_Lor
version: '1.0.2'
main: dev.zlor.ZLorPlugin
api-version: '1.21.11'
description: Сценарные системы Войда, устройства и драконий бой
authors: [Z_Server]
softdepend: [SmpLore, LuckPerms, WorldGuard, Essentials, TAB]
commands:
  lore:
    description: Меню сценариста
    aliases: [zlor]
    usage: /lore help
  scen:
    description: Управление собственными ролями сценаристов
    usage: /scen [add|delete] <игрок>
permissions:
  zlor.admin:
    description: Административная диагностика и выдача предметов; не заменяет роль scen
    default: op
