shahed:
  natural-spawn:
    enabled: true
    worlds: [world]
    interval-minutes: 30
    chance: 0.5
    max-active: 2
    min-height-above-ground: 35
    max-height-above-ground: 55
    min-distance-from-player: 60
    max-distance-from-player: 100
  flight:
    speed: 0.4
    smooth-movement: true
    avoid-obstacles: true
    lifetime-seconds: 180
  sound:
    enabled: true
    volume: 0.25
    max-distance: 45
  explosion:
    power: 4.0
    break-blocks: true
    damage-entities: true
  takeoff:
    duration-seconds: 4
    smooth-animation: true
shahed-3000:
  charge-time-ticks: 25
  projectile-speed: 2.0
  max-distance: 150
  cooldown-seconds: 3
  unlimited-ammo: true
  explosion:
    power: 6.0
    break-blocks: true
    damage-entities: true
permissions:
  give-op-only: true
  console-give: true
resource-pack:
  enabled: true
  prompt-on-join: true
  # Must return the ZIP itself with HTTP 200 and Content-Type application/zip.
  # Do not append ?download=1 to the GitHub URL: that endpoint returns an HTML page.
  url: "https://raw.githubusercontent.com/romagggrt-lgtm/123/main/dist/Shahed-ResourcePack.zip"
  sha1: "4cbfd9594d57f6a8d4b1db657a9d2cd75420dfb3"
  # Use server.properties to distribute the pack. Never put credentials here.
limits:
  max-total: 128
  despawn-player-distance: 192
