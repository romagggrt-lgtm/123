name: Z_Gold
version: '1.0.0'
main: dev.zgold.ZGoldPlugin
api-version: '1.21.11'
description: 'Golda: один парящий золотой слиток и персональный диалог.'
author: Z_Server
commands:
  zgold:
    description: 'Управление Golda'
    usage: '/zgold give <игрок> [количество] | reload | remove | removeall'
permissions:
  zgold.admin:
    description: 'Выдача яиц, перезагрузка и удаление Golda'
    default: op
  zgold.use:
    description: 'Использование яйца и взаимодействие с Golda'
    default: true
