name: Z_Lor native Paper smoke
on:
  push:
    branches: ['feature/z-lor-1.0.1-fixes']
    paths: ['lor/src/**', 'lor/pom.xml', 'tools/lor_live_*', 'tools/lor_vanilla_client.py', 'tools/build_lor*', '.github/workflows/zlor-native-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zlor-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and run unit regressions
        run: |
          mkdir -p lor/live-qa
          mvn -B -f lor/pom.xml verify 2>&1 | tee lor/live-qa/build.log
      - name: Prepare software OpenGL and original resource pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 scrot python3-tk
          python3 -m pip install --break-system-packages Pillow pyautogui nbtlib
          python3 tools/build_lor_pack.py
      - name: Actual Paper with protocol and unmodified graphical client
        env:
          ZLOR_VISUAL: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/lor_live_smoke.py
      - name: Preserve failures as reviewable evidence
        if: always()
        run: |
          test -f lor/live-qa/latest.json || python3 -c 'import json,os,pathlib; p=pathlib.Path("lor/live-qa"); p.mkdir(parents=True,exist_ok=True); (p/"latest.json").write_text(json.dumps({"status":"BLOCKED","reason":"Build did not reach the native smoke; inspect build.log","source_commit":os.environ.get("GITHUB_SHA"),"client_rendered":False},indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zlor-native-smoke
          path: lor/live-qa/
      - name: Record evidence on the tested feature branch
        if: always()
        env:
          TESTED_REF: ${{ github.ref_name }}
        run: |
          test -f lor/live-qa/latest.json || exit 0
          git fetch origin "$TESTED_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lor/live-qa/
          git diff --cached --quiet && exit 0
          git commit -m 'Record isolated Paper smoke evidence'
          git push origin "HEAD:refs/heads/$TESTED_REF"
