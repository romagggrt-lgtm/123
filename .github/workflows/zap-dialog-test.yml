name: Z_AP dialog visual QA
on:
  push:
    branches: [feature/z-ap-1.1.1]
    paths: ['ap/src/**', 'ap/pom.xml', 'tools/zap_visual_smoke.py', '.github/workflows/zap-dialog-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: |
          mkdir -p ap/target/deps ap/visual-qa
          curl -fL --retry 3 https://github.com/libraryaddict/LibsDisguises/releases/download/v26.10.24/LibsDisguises-26.10.24-Github.jar -o ap/target/deps/LibsDisguises.jar
          curl -fL --retry 3 https://github.com/retrooper/packetevents/releases/download/v2.14.0/packetevents-spigot-2.14.0.jar -o ap/target/deps/packetevents.jar
          mvn -B install:install-file -Dfile=ap/target/deps/LibsDisguises.jar -DgroupId=me.libraryaddict.disguises -DartifactId=libsdisguises -Dversion=26.10.24 -Dpackaging=jar -DgeneratePom=true
          mvn -B -f ap/pom.xml verify
          python3 -m pip install --break-system-packages Pillow python-xlib nbtlib
      - uses: actions/cache@v4
        with:
          path: |
            ap/target/visual-client/client.jar
            ap/target/visual-client/assets
            ap/target/visual-client/libraries
          key: minecraft-1.21.11-gui-asset-v2
      - name: Original Minecraft client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/zap_visual_smoke.py
      - name: Record test evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ap/visual-qa
          git diff --cached --quiet && exit 0
          git commit -m 'Record dialog test evidence [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dialog-evidence
          path: ap/visual-qa/
