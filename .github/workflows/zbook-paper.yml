name: Z_Book Paper 1.21.11 verification
on:
  push:
    branches: [feature/z-book-1.0.0]
    paths: ['book/**', 'tools/zbook*', '.github/workflows/zbook-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and unit tests
        run: |
          mvn -B -f book/pom.xml verify
          npm install --prefix book/target/bots --no-audit --no-fund mineflayer@4.39.0
      - name: Test real Paper with game client bots
        run: python3 tools/zbook_smoke.py
      - name: Prepare unmodified Minecraft client
        run: python3 -m pip install --break-system-packages Pillow python-xlib nbtlib
      - uses: actions/cache@v4
        with:
          path: |
            book/target/visual-client/client.jar
            book/target/visual-client/assets
            book/target/visual-client/libraries
          key: minecraft-1.21.11-zbook-assets-v1
      - name: Capture spell book on real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/zbook_visual.py
      - name: Record evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add book/live-qa book/visual-qa
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_Book Paper test evidence [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zbook-paper-evidence
          path: book/live-qa/
