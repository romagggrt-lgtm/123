name: Verify Z_Uluz crash recovery
on:
  push:
    branches: [research/z-recovery-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test recovery
        run: |
          git fetch origin feature/z-abilities-uluz-2026-11
          git worktree add /tmp/recovery FETCH_HEAD
          mkdir -p ci-bootstrap/recovery
          git -C /tmp/recovery rev-parse HEAD >ci-bootstrap/recovery/commit.txt
          curl -fsSL --retry 3 https://github.com/retrooper/packetevents/releases/download/v2.14.0/packetevents-spigot-2.14.0.jar -o /tmp/packetevents.jar
          mvn -B install:install-file -Dfile=/tmp/packetevents.jar -DgroupId=io.github.retrooper -DartifactId=packetevents-spigot -Dversion=2.14.0 -Dpackaging=jar -DgeneratePom=true >/tmp/install.log 2>&1
          mvn -B -f /tmp/recovery/uluz/pom.xml package >ci-bootstrap/recovery/build.log 2>&1
          npm install --prefix /tmp/recovery/tests/abilities --no-audit --no-fund mineflayer@4.39.0 >ci-bootstrap/recovery/npm.log 2>&1
          python3 /tmp/recovery/tests/abilities/recovery.py >ci-bootstrap/recovery/run.log 2>&1 || true
          cp -r /tmp/recovery/tests/abilities/output ci-bootstrap/recovery/live || true
      - name: Save results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/recovery
          git commit -m 'Save crash recovery results [skip ci]' || exit 0
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
