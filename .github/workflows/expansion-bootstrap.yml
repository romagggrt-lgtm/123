name: Verify corrected voidometer test scene
on:
  push:
    branches: [research/z-expansion-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare
        run: |
          git fetch origin feature/z-server-pack-1.14
          git worktree add /tmp/voidometer FETCH_HEAD
          mkdir -p ci-bootstrap/voidometer
          git -C /tmp/voidometer rev-parse HEAD > ci-bootstrap/voidometer/commit.txt
          python3 -m pip install --break-system-packages Pillow python-xlib nbtlib > ci-bootstrap/voidometer/dependencies.log 2>&1
      - name: Test actual vanilla client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          cd /tmp/voidometer
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/verify_voidometer_lighting.py > "$GITHUB_WORKSPACE/ci-bootstrap/voidometer/run.log" 2>&1 || true
          cp qa-voidometer/evidence/* "$GITHUB_WORKSPACE/ci-bootstrap/voidometer/" || true
      - name: Publish test evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/voidometer
          git commit -m 'Record vanilla voidometer lighting evidence [skip ci]' || exit 0
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
