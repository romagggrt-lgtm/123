name: Verify Z_Plast direct-link import
on:
  push:
    branches: [research/z-expansion-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  plast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build plugin and run tests
        run: |
          git fetch origin feature/z-plast-1.1.0
          git worktree add /tmp/zplast FETCH_HEAD
          mkdir -p ci-bootstrap/plast-next
          printf '%s\n' "$(git -C /tmp/zplast rev-parse HEAD)" >ci-bootstrap/plast-next/commit.txt
          mvn -B -f /tmp/zplast/plast/pom.xml verify >ci-bootstrap/plast-next/build.log 2>&1 || true
          if test -f /tmp/zplast/plast/target/Z_Plast-1.1.0.jar; then cp /tmp/zplast/plast/target/Z_Plast-1.1.0.jar ci-bootstrap/plast-next/; fi
      - name: Save test results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/plast-next
          git commit -m 'Save Z_Plast build results [skip ci]' || exit 0
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
