name: Verify Z_Plast with CustomJukebox
on:
  push:
    branches: [research/z-expansion-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  plast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build plugin and run tests
        run: |
          git fetch origin feature/z-plast-1.1.0
          git worktree add /tmp/zplast FETCH_HEAD
          rm -rf ci-bootstrap/plast-next
          mkdir -p ci-bootstrap/plast-next
          printf '%s\n' "$(git -C /tmp/zplast rev-parse HEAD)" >ci-bootstrap/plast-next/commit.txt
          mvn -B -f /tmp/zplast/plast/pom.xml verify >ci-bootstrap/plast-next/build.log 2>&1 || true
          if test -f /tmp/zplast/plast/target/Z_Plast-1.1.0.jar; then
            cp /tmp/zplast/plast/target/Z_Plast-1.1.0.jar ci-bootstrap/plast-next/
            npm install --prefix /tmp/zplast/tests/zplast --no-audit --no-fund mineflayer@4.39.0 >ci-bootstrap/plast-next/npm.log 2>&1
            python3 - <<'PYCODE' >ci-bootstrap/plast-next/custom-jukebox-download.log 2>&1 || true
          import urllib.request,json,hashlib,pathlib
          digest='7bff0566996bdc809752a41379b4cd8caff1bf26047bfb355ea9691d2fe59838'
          request=urllib.request.Request('https://api.modrinth.com/v2/version_file/'+digest+'?algorithm=sha256',headers={'User-Agent':'ZPlastCompatibilityTest/1.0'})
          with urllib.request.urlopen(request,timeout=30) as r: version=json.load(r)
          source=next(f['url'] for f in version['files'] if f.get('hashes',{}).get('sha256')==digest)
          with urllib.request.urlopen(urllib.request.Request(source,headers={'User-Agent':'ZPlastCompatibilityTest/1.0'}),timeout=60) as r: data=r.read()
          assert hashlib.sha256(data).hexdigest()==digest
          pathlib.Path('/tmp/CustomJukebox-3.7.1.jar').write_bytes(data)
          print('Exact CustomJukebox 3.7.1 user jar SHA-256 verified')
          PYCODE
            if test -s /tmp/CustomJukebox-3.7.1.jar; then export CUSTOM_JUKEBOX_JAR=/tmp/CustomJukebox-3.7.1.jar; fi
            python3 /tmp/zplast/tests/zplast/smoke.py >ci-bootstrap/plast-next/smoke.log 2>&1 || true
            cp /tmp/zplast/tests/zplast/output/* ci-bootstrap/plast-next/ || true
          fi
      - name: Save test results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/plast-next
          git commit -m 'Save Z_Plast build results [skip ci]' || exit 0
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
