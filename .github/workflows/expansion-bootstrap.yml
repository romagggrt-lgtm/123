name: Prepare Paper API for local verification
on:
  push:
    branches: [research/z-expansion-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  paper-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve official Paper API
        run: mvn -B -f book/pom.xml -DskipTests package
      - name: Save public API dependencies
        run: |
          mkdir -p ci-bootstrap
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          base=Path.home()/'.m2/repository'
          paths=['io/papermc/paper','com/mojang','net/md-5','org/spigotmc']
          with tarfile.open('ci-bootstrap/paper-api-deps.tar.gz','w:gz') as t:
              for n in paths:
                  p=base/n
                  if p.exists(): t.add(p,arcname=n)
          print('archive bytes:',Path('ci-bootstrap/paper-api-deps.tar.gz').stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/paper-api-deps.tar.gz
          git commit -m 'Cache official Paper API dependencies [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
