name: Prepare Paper API for local verification
on:
  push:
    branches: [research/z-expansion-bootstrap]
    paths: ['.github/workflows/expansion-bootstrap.yml']
permissions:
  contents: write
jobs:
  paper-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build expansion branch
        run: |
          git fetch origin feature/z-expansion-2026-11
          git worktree add /tmp/expansion FETCH_HEAD
          mkdir -p ci-bootstrap
          curl -fsSL --retry 3 https://github.com/libraryaddict/LibsDisguises/releases/download/v26.10.24/LibsDisguises-26.10.24-Github.jar -o /tmp/libsdisguises.jar
          mvn -B install:install-file -Dfile=/tmp/libsdisguises.jar -DgroupId=me.libraryaddict.disguises -DartifactId=libsdisguises -Dversion=26.10.24 -Dpackaging=jar -DgeneratePom=true
          for project in book tools-plugin lor plast ap; do
            mvn -B -f /tmp/expansion/$project/pom.xml -DskipTests package >ci-bootstrap/$project-build.log 2>&1 || true
          done
          printf '%s\n' "$(git -C /tmp/expansion rev-parse HEAD)" > ci-bootstrap/build-commit.txt
      - name: Save public API dependencies
        run: |
          mkdir -p ci-bootstrap
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          base=Path.home()/'.m2/repository'
          paths=['io/papermc/paper','com/mojang','net/md-5','org/spigotmc']
          with tarfile.open('ci-bootstrap/paper-api-deps.tar.gz','w:gz') as t:
              for n in paths:
                  p=base/n
                  if p.exists(): t.add(p,arcname=n)
          print('archive bytes:',Path('ci-bootstrap/paper-api-deps.tar.gz').stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ci-bootstrap/paper-api-deps.tar.gz ci-bootstrap/*-build.log ci-bootstrap/build-commit.txt
          git commit -m 'Cache official Paper API dependencies [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
