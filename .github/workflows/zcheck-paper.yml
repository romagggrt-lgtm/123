name: Z_Check Paper acceptance
on:
  push:
    branches: [feature/z-check-1.0.0]
    paths: ['check/src/**', 'check/pom.xml', 'tools/zcheck_*', '.github/workflows/zcheck-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -o pipefail
          mkdir -p check/live-qa
          mvn -B -f check/pom.xml verify 2>&1 | tee check/live-qa/build.log
      - run: |
          npm install --prefix check/target/bots --no-audit --no-fund mineflayer@4.39.0
          python3 tools/zcheck_smoke.py
      - name: Preserve evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add check/live-qa
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_Check Paper acceptance [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zcheck-native-evidence
          path: check/live-qa/
