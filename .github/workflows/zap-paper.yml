name: Z_AP Paper verification
on:
  push:
    branches: [feature/z-ap-1.0.0]
    paths: ['ap/src/**', 'ap/pom.xml', 'tools/zap_*', '.github/workflows/zap-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and packaging
        run: |
          set -o pipefail
          mkdir -p ap/live-qa ap/target/deps
          mvn -B -f ap/pom.xml verify 2>&1 | tee ap/live-qa/build.log
          curl -fL --retry 3 https://github.com/libraryaddict/LibsDisguises/releases/download/v26.10.24/LibsDisguises-26.10.24-Github.jar -o ap/target/deps/LibsDisguises.jar
          curl -fL --retry 3 https://github.com/retrooper/packetevents/releases/download/v2.14.0/packetevents-spigot-2.14.0.jar -o ap/target/deps/packetevents.jar
          npm install --prefix ap/target/bots --no-audit --no-fund mineflayer@4.39.0
      - name: Paper and actual clients
        run: python3 tools/zap_smoke.py
      - name: Preserve evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git add ap/live-qa
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_AP Paper acceptance [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-evidence
          path: ap/live-qa/
