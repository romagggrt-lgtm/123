name: Z_Test Paper verification
on:
  push:
    branches: ['feature/z-test-purgatory']
    paths: ['z_test/src/**', 'z_test/pom.xml', 'tools/ztest_*', '.github/workflows/ztest-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ztest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify
        run: |
          set -o pipefail
          mkdir -p z_test/qa
          mvn -B -f z_test/pom.xml verify 2>&1 | tee z_test/qa/build.log
      - name: Exercise gameplay and persistence on a disposable Paper server
        run: |
          set -o pipefail
          python3 tools/ztest_native_smoke.py 2>&1 | tee z_test/qa/native-run.log
      - name: Prepare verified plugin
        if: success()
        run: cp z_test/target/Z_Test-1.0.0.jar dist/Z_Test-1.0.0.jar
      - name: Preserve build evidence
        if: always()
        env:
          TESTED_REF: ${{ github.ref_name }}
        run: |
          mkdir -p z_test/qa
          git fetch origin "$TESTED_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add z_test/qa/
          if [ -f dist/Z_Test-1.0.0.jar ]; then git add dist/Z_Test-1.0.0.jar; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record Z_Test build evidence [skip ci]'
          git push origin "HEAD:refs/heads/$TESTED_REF"
