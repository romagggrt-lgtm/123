# Paper 1.21.11 / Java 21. Ресурс-пак и сторонние плагины не нужны.
allow-duplicate-nicks: false
display:
  max-visible-length: 32
  default-color: white
  # Сохраняется обычное поведение NameTag при приседании, невидимости и движении.
  collision-rule: always
  # Лёгкая сверка displayName для плагинов чата. Пакеты TAB защищены сразу.
  reconcile-interval-ticks: 40
messages:
  prefix: '&d[Z_Nick] &r'
  set: '&aНик {player} установлен: {nick}&a.'
  removed: '&aНик {player} сброшен.'
  reloaded: '&aКонфигурация и сохранённые ники перезагружены.'
  no-permission: '&cНедостаточно прав!'
  usage: '&e/znick set <ник> <игрок> | remove <игрок> | reload'
  unknown-player: '&cИгрок неизвестен серверу. Укажите настоящий ник или UUID игрока, который уже заходил.'
  invalid-nick: '&cНик должен содержать 1–{max} букв, цифр, символов _ или -. Допустимы &-цвета и HEX &#RRGGBB.'
  duplicate: '&cТакой ник уже используется другим игроком или совпадает с известным игровым аккаунтом.'
  not-set: '&eУ этого игрока нет установленного ника.'
  save-error: '&cНе удалось сохранить данные. Изменения не применены; подробности в консоли.'
  reload-error: '&cНе удалось перечитать настройки или ники. Действующие данные сохранены; подробности в консоли.'
